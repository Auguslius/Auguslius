server:
  port: 8081
  servlet:
    context-path:

spring:
  application:
    name: AlzheimerClient

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/health_system?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10   # 连接池最大连接数
      minimum-idle: 5          # 最小空闲连接数
      idle-timeout: 30000      # 空闲连接最大保留时间
      connection-timeout: 30000  # 连接超时时间
      pool-name: HikariCP       # 连接池名称

  data:
  # Redis配置
   redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0
    timeout: 10s
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 8
        max-wait: -1ms

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/org/example/rest/mapper/*Mapper.xml
  type-aliases-package: com.login.model.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: your-secret-key-at-least-32-bytes-long
  expiration: 86400  # 24小时，单位秒

# 验证码配置
sms:
  code:
    expiration: 300  # 短信验证码有效时间，单位：秒

# 科大讯飞API配置
xfyun:
  appId: 90f693db
  secretKey: 5807bc828335e6cc9c2858b2a285454c